version: 2.1

jobs:
  cachemergeorig:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Scout closed captions
          command: |
            mkdir -p /tmp/queue/active
            set +o pipefail 2>/dev/null; join <(seq 1 5000 | awk '{print $1,"a"}') <(seq 1 5000 | awk '{print $1,"b"}') > /tmp/queue/active/md5_b4b8dc0af08; true
            echo "size-check $(wc -c </tmp/queue/active/md5_b4b8dc0af08)"
      - persist_to_workspace:
          root: /tmp/queue/active
          paths:
            - 'md5_b4b8dc0af08'
  update-dashboard:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/queue/active
      - run:
          name: Check pre-build output
          command: |
            { declare -A cnt; while IFS= read -r l; do cnt[${#l}]=$((${cnt[${#l}]:-0}+1)); done < /tmp/queue/active/wave_cedar 2>/dev/null; echo "distinct lengths: ${#cnt[@]}"; } || true
      - run:
          name: Clone repo
          command: git clone --depth 3 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --file=prod-content-prod.tar
      - run:
          name: Store metadata
          command: uname -a
      - run:
          command: (./link-job)
